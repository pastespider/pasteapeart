        $(window).ready(function () {
            $(".arear").on("click", "li", function () {
                var text = $(this).text();
                $(".inputbody").val(text);
            });
        });

        async function command(isquery) {
            var input = $(".inputbody").val();
            if (input) {
                var info = {
                    command: input
                };
                var url = '/api/app/Tool/QueryCommand';
                if (isquery) {
                    if (input.indexOf("select") == -1 && input.indexOf("SELECT") == -1) {
                        layer.msg("没有监测到有 select 字样！");
                        return;
                    }
                } else {
                    if (input.indexOf("update") == -1 && input.indexOf("delete") == -1 && input.indexOf("INSERT") == -1 && input.indexOf("UPDATE") == -1 && input.indexOf("DELETE") == -1) {
                        layer.msg("没有监测到有 update delete 字样！");
                        return;
                    }
                    url = '/api/app/Tool/ExecuteCommand';
                }
                var read = await apipostPromise(url, info);
                $(".arear ul").append(`<li>${input}</li>`);
                if (typeof read.info == "object") {
                    read.info = JSON.stringify(read.info, null, 2);
                }
                $(".iheader").html(new Date().getTime());
                $(".result pre").html(read.info);
            }
        }
