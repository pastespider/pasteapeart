<body>
    <input type="hidden" id="TenantId" name="TenantId" value="" />

    <div class="loginceng"></div>

    <div class="loginWraperBack">
        <div id="loginform" class="loginarea">

            <div class="loginleft">
                <img src="./images/login-bg-2-4f806ec8.svg">
            </div>

            <form class="form newform" id="fromlogin">

                <div class="row headlogo"
                    style="font-size: 32px;text-align: left;margin-bottom: 60px;color:#676a6c;padding-left:10px;">
                    <span>PasteForm管理端</span>
                </div>

                <div class="row cl">
                    <label>账号</label>
                    <div class="formControls col-xs-8">
                        <input name="email" type="text" maxlength="64" placeholder="邮箱或者手机号码" value="admin@admin.com"
                            class="input-text size-L inputaccount">
                    </div>
                </div>

                <div class="row cl joinmodel">
                    <label>昵称</label>
                    <div class="formControls col-xs-8">
                        <input name="name" type="text" maxlength="16" placeholder="昵称" value=""
                            class="input-text size-L inputaccount">
                    </div>
                </div>

                <div class="row cl">
                    <label>密码</label>
                    <div class="formControls col-xs-8">
                        <input name="passWord" type="password" maxlength="32" placeholder="登陆密码" value="123456"
                            class="input-text size-L inputpass">
                    </div>
                </div>

                <div class="row cl joinmodel">
                    <label>确认密码</label>
                    <div class="formControls col-xs-8">
                        <input name="repassWord" type="password" maxlength="32" placeholder="重复上面的密码" value=""
                            class="input-text size-L inputpass">
                    </div>
                </div>

                <div class="row cl" style="display: none;">
                    <div class="formControls ">
                        <input class="input-text size-L" type="text" name="guid" placeholder="批次号" style="width:150px;">
                    </div>
                </div>

                <div class="row cl">
                    <div class="formControls col-xs-8" style="display:flex;flex-direction: row;">
                        <img class="imgcode" onclick="_imagechange()"
                            style="width:120px;height: 40px;border-radius: 4px;">
                        <input name="code" type="text" style="flex:1;" placeholder=""  onkeyup="handler_keyup(event)" value="" class="">
                    </div>
                </div>

                <div class="row cl joinmodel">
                    <label>创建站点</label>
                    <div class="formControls ">
                        <input type="checkbox" class="mui-switch-anim mui-switch" value="" placeholder="" checked
                            name="addapp">
                    </div>
                </div>

                <div class="row cl" style="display:none;">
                    <div class="select">
                        <a class="loginmodel" href="javascript:;" onclick="handlerExchangeJoin('join')">没有账号,去注册一个</a>
                        <a class="joinmodel" href="javascript:;" onclick="handlerExchangeJoin('login')">已经有账号，去登陆</a>
                    </div>

                </div>

                <div class="row cl">
                    <div class="formControls ">
                        <button type="button" onclick="funchandlerlogin()"
                            class="btn btn-success radius size-L">登陆</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="footerarea">- -- ---Copyright https://soft.pastecode.cn/ 2024--- -- -</div>
    <script type="text/javascript" src="../lib/jquery/1.9.1/jquery.min.js"></script>
    <script type="text/javascript" src="../static/h-ui/js/H-ui.min.js"></script>
    <script type="text/javascript" src="../lib/api.js"></script>
    <script type="text/javascript" src="../lib/layer/3.1.1/layer.js"></script>
    <script type="text/javascript">

        function randomString(len) {
            len = len || 32;
            var $chars = 'ABCDEFGHJKMNPQRSTWXYZabcdefhijkmnprstwxyz2345678';    /****默认去掉了容易混淆的字符oOLl,9gq,Vv,Uu,I1****/
            var maxPos = $chars.length;
            var pwd = '';
            for (i = 0; i < len; i++) {
                pwd += $chars.charAt(Math.floor(Math.random() * maxPos));
            }
            return pwd;
        }
        var tguid = "";
        $(window).ready(function () {
            _imagechange();
            $(".inputsure").keyup(function (event) {
                if (event.keyCode == 13) {
                    funchandlerlogin();
                }
            });
            $(".inputpass").keyup(function (event) {
                if (event.keyCode == 13) {
                    funchandlerlogin();
                }
            });
            $(".inputaccount").keyup(function (event) {
                if (event.keyCode == 13) {
                    $(".inputpass").focus();
                }
            })
            $(".issms").hide();
            var timertick = 0;
            if (_isloginmodel) {
                $(".joinmodel").hide();
                $(".loginmodel").show();
            }
            if(location.host=="localhost"){
                $("input[name=email]").val("admin@admin.com");
                $("input[name=passWord]").val("123456");
            }
        });

        var _isloginmodel = true;
        function handlerExchangeJoin(style) {
            if (style == 'join') {
                $(".joinmodel").show();
                $(".loginmodel").hide();
                $(".btn-success").html('注册');
                _isloginmodel = false;
            } else {
                $(".joinmodel").hide();
                $(".loginmodel").show();
                $(".btn-success").html('登陆');
                _isloginmodel = true;
            }
        }

        function _imagechange() {
            tguid = randomString(16);
            $("[name=guid]").val(tguid);
            $(".imgcode").attr("src", "/api/app/User/Image?guid=" + tguid);
        }

        /**
 * 输入框回车发送
 * @param {*} event 
 */
function handler_keyup(event) {
    if (event.key == 'Enter') {
        funchandlerlogin();
    }
}

function queryStringToObject(queryString) {
  // 如果传入的是完整的 URL，会自动解析查询参数部分
  const params = new URLSearchParams(queryString);
  const result = {};
  for (const [key, value] of params) {
    // 如果键已存在，将其转换为数组
    if (result.hasOwnProperty(key)) {
      if (Array.isArray(result[key])) {
        result[key].push(value);
      } else {
        result[key] = [result[key], value];
      }
    } else {
      result[key] = value;
    }
  }
  
  return result;
}

// // 使用示例
// const queryStr = "name=张三&age=25&hobbies=篮球&hobbies=游泳";
// const obj = queryStringToObject(queryStr);
// console.log(obj);

        /**
         * 点击登陆或者注册
         **/
        function funchandlerlogin() {
            var dataobj = $("#fromlogin").parseForm();
            dataobj.search = location.search;

            var queryObj=queryStringToObject(location.search);
            //参数转object
            //        _config = Object.assign({}, _config, pasteform_custom_config);
            var info={};
            info = Object.assign({},queryObj,dataobj);

            if (_isloginmodel) {
                _apipost("/api/app/User/Login", true, JSON.stringify(info), function (code, obj) {
                    if (code == 200) {
                        saveToken(obj.token);
                        layer.msg("登录成功", { time: 1500 }, function () {

                            var _refer = document.referrer;
                            if(_refer){
                                if(_refer.indexOf(location.href)>0){
                                    window.parent.location.replace(_refer);
                                }
                            }
                            window.parent.location.replace("../index.html");
                        });
                    } else {
                        _imagechange();
                        $("[name=code]").val('');
                    }
                });
            } else {

                if (!dataobj.passWord) {
                    layer.msg("密码不能为空，请重新输入！");
                    return;
                }
                if (dataobj.repassWord != dataobj.passWord) {
                    layer.msg('密码和重复密码需要一致，请重新输入');
                    return;
                }
                if (!dataobj.name) {
                    layer.msg("用户名不能为空，请重新输入");
                    return;
                }

                //需要排版成，从query中获取参数，附带给登录或者注册

                _apipost("/api/app/User/Join", true, JSON.stringify(info), (code, obj) => {
                    if (code == 200) {
                        layer.msg(obj);
                        handlerExchangeJoin('login');
                    }
                    _imagechange();
                    $("[name=code]").val('');

                });
            }
        }

    </script>
