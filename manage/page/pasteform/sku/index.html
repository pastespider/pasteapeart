    <script>
        var _isrunning = false;
        Vue.use(window['vue-cropper'].default)

        // 注册图片上传组件
        Vue.component('image-upload', {
            props: {
                // 初始图片URL
                initialImage: {
                    type: String,
                    default: null
                }
            },
            template: `
                <div class="image-upload-container">
                    <div class="image-preview" @click="handleImageClick">
                        <!-- 图片预览区域 -->
                        <img 
                            v-if="imageUrl" 
                            :src="imageUrl" 
                            alt="预览图" 
                            class="preview-img"
                        >
                        
                        <!-- 默认图标（无图片时显示） -->
                        <div v-else class="default-icon">
                            <i class="Hui-iconfont Hui-iconfont-add3"></i>
                            <!-- <span class="upload-text">点击上传</span> -->
                        </div>
                        
                        <!-- 删除按钮（有图片时显示） -->
                        <button 
                            v-if="imageUrl" 
                            class="delete-btn" 
                            @click.stop="handleDelete"
                        >
                            <i class="Hui-iconfont Hui-iconfont-close2"></i>
                        </button>
                        
                        <!-- 文件上传输入框（隐藏） -->
                        <input 
                            type="file" 
                            ref="fileInput" 
                            accept="image/*" 
                            @change="handleFileChange"
                            class="file-input"
                        >
                    </div>
                </div>
            `,
            data() {
                return {
                    imageUrl: this.initialImage // 存储图片的URL
                }
            },
            watch: {
                // 监听初始图片变化
                initialImage(newVal) {
                    this.imageUrl = newVal;
                }
            },
            methods: {
                // 点击图片区域触发文件选择
                handleImageClick() {
                    this.$refs.fileInput.click();
                },
                
                // 处理文件选择
                handleFileChange(e) {
                    const file = e.target.files[0];
                    if (file) {
                        this.previewImage(file);
                        // 清空输入框值，以便可以重复选择同一文件
                        e.target.value = '';
                    }
                },
                
                // 预览图片
                previewImage(file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        // this.imageUrl = e.target.result;
                        // 触发事件，通知父组件图片已更改
                        // this.$emit('image-change', this.imageUrl, file);
                        
                        // 这里可以添加上传到服务器的逻辑
                         this.uploadToServer(file);
                    };
                    reader.readAsDataURL(file);
                },
                
                // 删除图片
                handleDelete() {
                    this.imageUrl = null;
                    // 触发事件，通知父组件图片已删除
                    this.$emit('image-change', null);
                },
                
                // 上传到服务器的示例方法
                uploadToServer(file) {
                    // 实际项目中实现上传逻辑
                    const formData = new FormData();
                    formData.append('image', file);
                    
                    // 示例：使用fetch上传
                    /*
                    fetch('/api/upload', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log('上传成功', data);
                        // 如果服务器返回了图片URL，可以更新imageUrl
                        // this.imageUrl = data.imageUrl;
                    })
                    .catch(error => {
                        console.error('上传失败', error);
                        // 上传失败时清除预览
                        this.imageUrl = this.initialImage;
                    });
                    */
                    $.ajax({
                        url: "/api/app/Upload/UpImage?type=sku&size=1500*0",
                        type: 'post',
                        contentType: false,
                        processData: false,
                        async: true,
                        data: formData,
                        headers: { "token": readToken() },
                        success: (obj) => {
                            this.imageUrl = obj.data[0].url;
                            this.$emit('image-change', this.imageUrl, file);
                        },
                        error: (res) => {
                            if (res.status == 413) {
                                layer.msg('图片超过限制')
                            }
                            if (res.status == 401) {
                                layer.msg('登录过期，请重新登录')
                            }
                            if (res.status == 403) {
                                layer.msg('您没有此操作权限')
                            }
                            if (loadid != 0) {
                                layer.close(loadid);
                            }
                        }
                    });
                    //图片上传
                }
            }
        });


        new Vue({
            el: '#app',
            data() {

                var skulist = (rule, value, callback) => {
                    for (const i of this.privateGoodsItem) {
                        if (!i.privateSpecName || i.dynamicTags.length == 0) {
                            return callback(new Error('请填入规格名并填入最少一个规格值'));
                        } else {
                            callback();
                        }
                    }
                    for (const i of this.sku_ui_list) {
                        if (i.sellPriceYuan == 0 || !i.sellPriceYuan) {
                            return callback(new Error('请填入价格'));
                        } else {
                            callback();
                        }
                    }
                };
                return {
                    id: 0,
                    isAddSkuImg: false, //添加sku图片

                    dialogImageUrl: '',
                    dialogVisible: false,
                    disabled: false,
                    list: [
                        { id: 0, name: '未选择，使用统一邮费' },
                    ],
                    myCroppa: {},
                    option: {
                        img: 'https://avatars2.githubusercontent.com/u/15681693?s=460&v=4',
                        size: 1,
                        full: false,
                        outputType: 'png',
                        canMove: true,
                        fixedBox: false,
                        original: false,
                        canMoveBox: true,
                        autoCrop: true,
                        // 只有自动截图开启 宽度高度才生效
                        autoCropWidth: 750,
                        autoCropHeight: 340,
                        centerBox: true,
                        high: true,
                        max: 99999
                    },
                    fixed: true,
                    fixedNumber: [1, 1], //[4, 3]
                    imgObj: {
                        width: 500,
                        height: 500
                    },
                    filename: '',
                    fileList: [],
                    examList: [],
                    bannerList: [],
                    headList: [],
                    showImageList: [],
                    showVideoList: [],
                    limitMin: 0,
                    limitTotal: 0,
                    limitTimeMax: 0,
                    drag: false,
                    preview: {},
                    tableColumnList: {
                        tableHeaderList: [],
                        tableBodyList: []
                        // inventory: ''
                    },
                    sku_ui_list:[],
                    privateGoodsItem: [
                        {
                            privateSpecName: '', //规格名
                            dynamicTags: [], //规格值数组
                            desc: [{
                                value: '',
                                vcode: this.getRandom(),
                                skuimgurl: '',
                            }],
                            inputVisible: false,
                            inputValue: '',
                            vcode: this.getRandom(),
                            isAddSkuImg: false
                        }
                    ],
                    presaleform: {
                        stock_type: 0,
                        full_payment_presale_delivery_type: null,
                        presale_begin_time: null,
                        presale_end_time: null,
                        presale_begin_time_show: null,
                        presale_end_time_show: null,
                        full_payment_presale_delivery_time: null,
                    },
                    starindex: 0, //复制图片起始位置
                    moveIndex: 0, //复制图片移动中位置
                    rules: {
                        privateSpecName: [{ required: true, validator: skulist, trigger: 'blur' }]
                    },
                    cateList: [],

                    compressFile: null,

                    lastfinal: [], //上一次的规格内容数组


                    skubody: [], //规格预览数组
                    skuShow: false, //规格数组显示
                    showView: true, //预览显示

                    openAppList: [],
                    stockNumSet: 10000,
                    moneyNumSet: null,
                    showForm: true, //表单弹出页还是长页



                    contentStyleObj: {
                        // height: '86vh',
                    },


                    repeatTag: '', //重复的sku规格值

                    skuOptionList: [],
                    cateid: 0,

                    pickerOptions: {
                        shortcuts: [{
                            text: '今天',
                            onClick(picker) {
                                picker.$emit('pick', new Date());
                            }
                        }, {
                            text: '昨天',
                            onClick(picker) {
                                const date = new Date();
                                date.setTime(date.getTime() - 3600 * 1000 * 24);
                                picker.$emit('pick', date);
                            }
                        }, {
                            text: '一周前',
                            onClick(picker) {
                                const date = new Date();
                                date.setTime(date.getTime() - 3600 * 1000 * 24 * 7);
                                picker.$emit('pick', date);
                            }
                        }]
                    },
                    showPresale: false,
                    session_key: ''
                }
            },
            watch: {
                'option.img': {
                    handler: function (val) {
                        const that = this
                        const img = new Image()
                        img.src = val
                        img.onload = function () {
                            that.imgObj.width = this.width / 2
                            that.imgObj.height = this.height / 2
                        }
                    },
                    immediate: true
                },
                bannerList() {
                    var imagelist = ['png', 'jpg', 'jpeg', 'bmp', 'gif']
                    console.log(this.bannerList);
                    this.showImageList = this.bannerList.filter(function (image) {
                        // 使用some方法检查image是否包含imagelist中的某个后缀  
                        return imagelist.some(function (extension) {
                            // 使用endsWith方法检查image是否以某个后缀结尾  
                            return image.url.endsWith(extension);
                        });
                    });

                    // 使用filter方法筛选出不包含imagelist中后缀的字符串  
                    this.showVideoList = this.bannerList.filter(function (image) {
                        // 对匹配的取反即为不包含  
                        return !imagelist.some(function (extension) {
                            return image.url.endsWith(extension);
                        });
                    });
                },
                // 监听规格数据
                calculateAttribute(newArray) {
                    console.log(newArray, 'newval');
                    console.log(this.sku_ui_list, '596this.sku_ui_list');

                    // setTimeout(function(){

                    // },300);
                    var _findempty = false;
                    newArray.forEach(newar => {
                        if (newar.childer) {
                            for (var ione of newar.childer) {
                                if (ione.value.length == 0) {
                                    _findempty = true;
                                    break;
                                }
                            }
                        }
                    });
                    if (_findempty) {
                        console.log("规格值有空值，不再继续执行！");
                        return;
                    }

                    // if(_isrunning){
                    //     return;
                    // }
                    _isrunning = true;
                    // console.log('----------- begin check ------------');

                    let tableObj = {
                        tableBodyList: [],
                        tableHeaderList: []
                    }
                    // 表头
                    let skuTableArr = JSON.parse(JSON.stringify(newArray))
                    tableObj.tableHeaderList = skuTableArr.map((item) => {
                        return {
                            prop: item.name,
                            propName: item.name
                        }
                    })
                    // console.log(tableObj.tableHeaderList, 'tableObj.tableHeaderList');
                    this.tableColumnList.tableHeaderList = tableObj.tableHeaderList // 表头

                    let cloneNewVal = JSON.parse(JSON.stringify(newArray))
                    let attrName = [] //规格名数组
                    let attrValue = [] //规格值数组

                    let allvalarray = [];//所有的规格值的vcode的数组，综合在一起

                    for (let i of cloneNewVal) {
                        console.log(cloneNewVal, 'key');
                        attrName.push(i.name)
                        let attrArr = []
                        i.childer.forEach((vals) => {
                            attrArr.push(vals.vcode)
                            if (allvalarray.indexOf(vals.vcode) == -1) {
                                allvalarray.push(vals.vcode);
                            }
                        })
                        attrValue.push(attrArr)
                    }
                    console.log(attrValue, 'attrValue');
                    // console.log(this.privateGoodsItem.length, Object.keys(newVal).length);
                    // 表格内容数据（笛卡尔积算法）
                    let finalArr = this.cartesianProductOf(...attrValue)
                    console.log(finalArr, 'finalArr');
                    // vcode
                    //[
                    //{'1231234','123123'}
                    //]
                    var _vcode_map = new Map();// string:{name value vcode ncode}
                    newArray.forEach(newar => {

                matharrayadd(array1, array2) {
                    //输出array1 比array2多的数组集合
                    if (array2 && array2.length > 0) {
                        var _clone = Object.assign([], array1);
                        array2.forEach(ia => {
                            var _index = _clone.indexOf(ia);
                            if (_index >= 0) {
                                _clone.splice(_index, 1);
                            }
                        })
                        return _clone;
                    }
                    return array1;
                },
                matharrayallinclude(array1, array2) {
                    //array1是否全部包含array2 也就是array2中的每一项在array1中都有，且array1大于array2
                    if (array1.length > array2.length) {
                        var _clone = Object.assign([], array2);
                        array1.forEach(ia => {
                            var _index = _clone.indexOf(ia);
                            if (_index >= 0) {
                                _clone.splice(_index, 1);
                            }
                        })
                        return (_clone.length == 0);
                    }
                    return false;
                },
                matharrayequal(array1, array2) {
                    //对比2个数组是否相等 也可以使用排序后的字符串对比
                    if (array1.length == array2.length) {
                        // var _clone = Object.assign([], array1);
                        var _hitcount = 0;
                        array2.forEach(ia => {
                            var _index = array1.indexOf(ia);
                            if (_index >= 0) {
                                _hitcount++
                                // _clone.splice(_index, 1);
                            }
                        })
                        return array1.length == _hitcount;
                    }
                    return false;
                },
                matharrayinclude(array1, array2) {
                    //array1 是否有元素在array2中，有一个也算
                    if (array1.length > 0 && array2.length > 0) {
                        for (var ia of array2) {
                            var _index = array1.indexOf(ia);
                            if (_index >= 0) {
                                return true;
                            }
                        }
                    }
                    return false;
