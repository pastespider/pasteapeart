<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit|ie-comp|ie-stand">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-siteapp" />
    <link rel="stylesheet" type="text/css" href="../lib/Hui-iconfont/1.0.8/iconfont.css" />
    <!-- <link rel="stylesheet" type="text/css" href="./style.css" /> 改成下面的 ../lib/pasteform.css -->

    <link rel="stylesheet" type="text/css" href="./index.css?v=260902">
    <!-- <link href="../lib/page.min.css" rel="stylesheet" type="text/css" /> -->
    <link href="../lib/jquery.pagination.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" type="text/css" href="../lib/pasteform.css">
    <title>数据查看页</title>
</head>

<body>

    <div class="page-container index-page">
        <div class="searcharea">
            <form id="formsearch" class="pasteform oneline"  onsubmit="return false;" action="javascript:void(0);">
                <div class="searchbox"></div>
            </form>
            <div class="tap_more">
                <i class="Hui-iconfont Hui-iconfont-arrow3-bottom" style="cursor: pointer;"
                    onclick="func_auto_searcharea(this);"></i>
            </div>
        </div>
        <div class="ppbody">
            <div class="st">
                
                <input type="button" class="isedit btn btnstyle btnadd" value="新增" onclick="tap_add_form(this);" />

                <!-- 用于显示表名或者是模块名称 -->
                <span class="sn"></span>
                <!-- 模块的介绍补充 -->
                <span class="idesc"></span>

                <!-- 功能按钮区域 -->
                <div class="func_btn_area"></div>

                <!-- 切换table和chart模式 -->
                 <div class="show_type">
                    <i class="Hui-iconfont Hui-iconfont-zhongtumoshi type_table rbtn selected" onclick="handlerChangeShowType(false,this);"></i>
                    <i class="Hui-iconfont Hui-iconfont-tongji-xian type_chart rbtn" onclick="handlerChangeShowType(true,this);"></i>
                 </div>

                <input type="button" class="btnsearch btn" onclick="readPageData(1);" value="查询">
                <a class="btnrefush" href="javascript:location.replace(location.href);" title="刷新"><i
                        class="Hui-iconfont">&#xe68f;</i></a>
                <a href="javascript:func_auto_searcharea(this);" class="btnautoarea" title="显示更多查询项"><i
                        class="Hui-iconfont Hui-iconfont-search1"></i></a>
                        <a href="javascript:printTable(this);" class="btnautoarea" title="打印当前页，建议使用横向模式"><i
                            class="Hui-iconfont Hui-iconfont-dayinji"></i></a>
                            <a href="javascript:cleanTableColumnOrder(this);" class="btnautoarea btn_clear_order_column" title="清理列排序缓存"><i
                                class="Hui-iconfont Hui-iconfont-del2"></i></a>
            </div>
            <div class="batcharea"></div>
            <div class="mt-20 table_wrap">
                <table id="data-table" class="table table-border table-bordered tb_freeze table-bg table-hover table-sort table-responsive">
                    <thead>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
                <div class="data_echart" id="data_echart">

                </div>
            </div>
        </div>


        <div class="page_foot">
            <div class="totalsum"></div>
            <div id="pagenumarea" class="pagenumarea"></div>
        </div>

        <!-- 查询的信息模板，switch写法 -->
        <script type="text/html" id="template_search">
            <% list.forEach(item=>{ %>
                <% if(item.dataType == 'html'){%>
                    <%:=item.html%>
                <% }else{ %>
                    <div class="sitem <%if(item.class){%><%:=item.class%><%}%>" <%if(item.hidden){%>style="display:none;"<%}%>>
                        <span class="tl"><%:=item.title%>:</span>
                        <!-- switch.start -->
                            <% switch(item.dataType) { 
                                case "String": case "Guid": case "splitarray": %>

                                        <% if(item.mark){ %>
                                            <span class="tapmark" onclick="global_tap_mark('<%:=item.mark.model%>','<%:=item.mark.value%>','<%:=item.mark.style%>',this)">?</span>
                                        <% } %>
                                        <input type="text" name="<%:=item.name%>" class="inputword" onkeyup="handler_keyup(event)" <% if(item.value && item.value != null ){%>value="<%:=item.value%>"<%}%> placeholder="<%:=item.placeholder || ''%>">
                                        <span class="Hui-iconfont Hui-iconfont-del spanclean" onclick="handlerSearchClean(this)"></span>
                                        <%if(item.unit){%>
                                            <span class="unit"><%:=item.unit%></span>
                                        <%}%>
                                   
                                <% break; 
                                case "Int32": case "Int64": %>

                                        <% if(item.mark){ %>
                                            <span class="tapmark" onclick="global_tap_mark('<%:=item.mark.model%>','<%:=item.mark.value%>','<%:=item.mark.style%>',this)">?</span>
                                        <% } %>
                                        <input type="number" name="<%:=item.name%>" class="inputword"  onkeyup="handler_keyup(event)"  <% if(item.value){%>value="<%:=item.value%>"<%}%> placeholder="<%:=item.placeholder || ''%>">
                                        <span class="Hui-iconfont Hui-iconfont-del spanclean" onclick="handlerSearchClean(this)"></span>
                                        <%if(item.unit){%>
                                            <span class="unit"><%:=item.unit%></span>
                                        <%}%>
                                    
                                <% break; 
                                case "fentoyuan": %>
                                    <input name="<%:=item.name%>" autocomplete="to-off" class="input-number" step="0.01" min="0" max="99999999" placeholder-class="p-form-placeholder" <% if(item.readonly){ %>readonly<% } %> type="number" value="<%:=item.value || ''%>" placeholder="<%:=item.placeholder%>" />
                                    <span class="unit">元</span>
                                <% break; 
                                case "Boolean": %>

                                        <% if(item.mark){ %>
                                            <span class="tapmark" onclick="global_tap_mark('<%:=item.mark.model%>','<%:=item.mark.value%>','<%:=item.mark.style%>',this)">?</span>
                                        <% } %>
                                        <input type="checkbox" class="input-checkbox mui-switch mui-switch-anim" <% if(item.value){%>checked<%}%> name="<%:=item.name%>">
                                        <span class="placeholder"><%:=item?.placeholder || ''%></span>
                                    
                                <% break;
                                case "Double": case "Decimal": case "Float": %>

                                        <% if(item.mark){ %>
                                            <span class="tapmark" onclick="global_tap_mark('<%:=item.mark.model%>','<%:=item.mark.value%>','<%:=item.mark.style%>',this)">?</span>
                                        <% } %>
                                        <input type="number" name="<%:=item.name%>" class="inputword" step="<%:=item.step || 0.0001%>"  onkeyup="handler_keyup(event)"  <% if(item.value){%>value="<%:=item.value%>"<%}%> placeholder="<%:=item.placeholder || ''%>">
                                        <%if(item.unit){%>
                                            <span class="unit"><%:=item.unit%></span>
                                        <%}%>
                                        <span class="Hui-iconfont Hui-iconfont-del spanclean" onclick="handlerSearchClean(this)"></span>
                                    
                                <% break; 
                                case "outer": %>

                                        <% if(item.mark){ %>
                                            <span class="tapmark" onclick="global_tap_mark('<%:=item.mark.model%>','<%:=item.mark.value%>','<%:=item.mark.style%>',this)">?</span>
                                        <% } %>
                                        <% if(item.dataFrom=='Int32' || item.dataFrom=='Int64'){ %>
                                            <input type="number" class="outerid" style="display:none;" <% if(item.value){ %>value="<%:=item.value%>"<%}%> name="<%:=item.name%>">
                                        <%}else{%>
                                            <input type="text" class="outerid" style="display:none;" <% if(item.value && item.value != null){ %>value="<%:=item.value%>"<% } %> name="<%:=item.name%>">
                                        <%}%>
                                        <input type="text" class="outerdisplay" dataname="<%:=item.name%>" value="<%:=item.display%>" onclick="handler_outer_value(this)" readonly placeholder="<%:=item.placeholder%>" >
                                        <span class="Hui-iconfont Hui-iconfont-del spanclean" onclick="handlerSearchCleanOuterInput(this)"></span>
                                  
                                <% break; 
                                case "select": %>

                                        <% if(item.mark){ %>
                                            <span class="tapmark" onclick="global_tap_mark('<%:=item.mark.model%>','<%:=item.mark.value%>','<%:=item.mark.style%>',this)">?</span>
                                        <% } %>
                                        <select name="<%:=item.name%>" onchange="handler_select_change(this);">
                                            <% if(item.selects){ %>
                                                <% item.selects.forEach(_select=>{ %>
                                                    <option value="<%:=_select.value%>" <% if(_select.value==item.value){%>selected<% } %>><%:=_select.name%></option>
                                                <% }) %>
                                            <%}%>
                                        </select>
                                    
                                <% break; 
                                case "lselect": %>

                                        <% if(item.mark){ %>
                                            <span class="tapmark" onclick="global_tap_mark('<%:=item.mark.model%>','<%:=item.mark.value%>','<%:=item.mark.style%>',this)">?</span>
                                        <% } %>
                                        <ul class="ulitems lselect <%:=item.selects_max%>" name="<%:=item.name%>">
                                            <% if(item.selects){ %>
                                                <% item.selects.forEach(_select=>{ %>
                                                    <li class="selectli <%if(_select.selected){%>selected<%}%>" value="<%:=_select.value%>"><%:=_select.name%></li>
                                                <% }) %>
                                            <%}%>
                                        </ul>
                                   
                                <% break; 
                                case "selects": %>
                                        <% if(item.mark){ %>
                                            <span class="tapmark" onclick="global_tap_mark('<%:=item.mark.model%>','<%:=item.mark.value%>','<%:=item.mark.style%>',this)">?</span>
                                        <% } %>
                                        <input type="text" name="<%:=item.name%>__sval" onclick="funcChangeSelectArea(this)" <%if(item.__selected_values){%>value="<%:=item.__selected_values%>"<%}%> class="inputword" placeholder="<%:=item.placeholder || ''%>" readonly>
                                        <ul class="ulitems ulselects" name="<%:=item.name%>">
                                            <% if(item.selects){ %>
                                                <% item.selects.forEach(_select=>{ %>
                                                    <li class="selectli <%if(_select.selected){%>selected<%}%>" value="<%:=_select.value%>"><%:=_select.name%></li>
                                                <% }) %>
                                            <%}%>
                                        </ul>
                                    
                                <% break; 
                                case "DateTime": %>
    
                                        <% if(item.mark){ %>
                                            <span class="tapmark" onclick="global_tap_mark('<%:=item.mark.model%>','<%:=item.mark.value%>','<%:=item.mark.style%>',this)">?</span>
                                        <% } %>
                                        <input type="text" name="<%:=item.name%>" <%if(item.value){%>value="<%:=item.value%>"<%}%> class="inputword" onClick="WdatePicker({el:this,dateFmt:'<%:=item.format%>'})" placeholder="<%:=item.placeholder || ''%>">
                                        <span class="Hui-iconfont Hui-iconfont-del spanclean" onclick="handlerSearchClean(this)"></span>
                                    
                                <% break; 
                                case "datalist": %>

                                        <% if(item.mark){ %>
                                            <span class="tapmark" onclick="global_tap_mark('<%:=item.mark.model%>','<%:=item.mark.value%>','<%:=item.mark.style%>',this)">?</span>
                                        <% } %>
                                        <input type="text" name="<%:=item.name%>" class="inputword" list="<%:=item.name%>" placeholder="<%:=item.placeholder || ''%>">
                                        <% if(item.selects){ %>
                                            <datalist id="<%:=item.datalistid%>">
                                                <% item.selects.forEach(_select=>{ %>
                                                    <option value="<%:=_select.value%>" ><%:=_select.name%>(<%:=_select.value%>)</option>
                                                <% }) %>
                                            </datalist>
                                        <%}%>
                                        <span class="Hui-iconfont Hui-iconfont-del spanclean" onclick="handlerSearchClean(this)"></span>
                                  
                                <% break; 
                                case "daterange": %>
   
                                        <% if(item.mark){ %>
                                            <span class="tapmark" onclick="global_tap_mark('<%:=item.mark.model%>','<%:=item.mark.value%>','<%:=item.mark.style%>',this)">?</span>
                                        <% } %>
                                        <input type="text" class="inputword drange" name="<%:=item.name%>" readonly datas="" datae="" <%if(item.value){%>value="<%:=item.value%>"<%}%> placeholder="<%:=item.placeholder || ''%>" id="<%:=item.name%>">
                                    
                                <% break; 
                                case "searchrange": %>

                                        <% if(item.mark){ %>
                                            <span class="tapmark" onclick="global_tap_mark('<%:=item.mark.model%>','<%:=item.mark.value%>','<%:=item.mark.style%>',this)">?</span>
                                        <% } %>
                                        <div class="range_input">
                                            <input type="number" step="<%:=item.range.step%>" class="inputword" placeholder="<%:=item.range.placeholder || ''%>" name="<%:=item.range.low_name%>">
                                            <span>-</span>
                                            <input type="number" step="<%:=item.range.step%>" class="inputword" placeholder="<%:=item.range.placeholder || ''%>" name="<%:=item.range.high_name%>">
                                        </div>

                                <% break; 
                                default: %>
                                    <!--未处理的对象<%:=item.dataType%>-->
                                    <!-- 可根据需要添加默认处理逻辑 -->
                                <% break; 
                            } %>
                        <!-- switch.end -->
                        <%if(item.unit){%>
                            <span class="unit"><%:=item.unit%></span>
                        <%}%>
                    </div>
                <% } %>
            <% }) %>
        </script>    


        <!-- 头部的批量操作的模板 -->
        <script type="text/html" id="template_batch">
            <div class="buttons">
                <% batchs.forEach(item=>{ %>
                    <input type="button" class="btn btntool <%:=item.icon%>" value=<%:=item.name%> title="<%:=item.title%>" onclick="<%:=item.func%>" >
                <% }) %>
            </div>
        </script>

        <!-- 头部的信息模板 -->
        <script type="text/html" id="template_header">
                <tr>
                    <% if(config.batch){ %> 
                        <th data-column="__chexkbox"><input type="checkbox" class="cbbatch batch-select-switch" onchange="tap_batch_check_change(this);"> </th>
                    <%}%>
                    <% for(var k=0;k< list.length;k++){ %>
                        <% var item = list[k]; %>

                        <% if(!item.hidden){ %>
                            <% if(item.name =="extendBind"){ %>
                                <th data-column="<%:=item.name%>">
                                    <input type="checkbox" class="input-checkbox batch-bind-switch" onchange="handler_batch_switch(this)">全选/取消
                                </th>
                                <% continue; %>
                            <% } %>

                            <th data-column="<%:=item.name%>" <% if(item.thclass){ %>class="<%:=item.thclass%>"<% } %> >
                            <% if(config.drag_order_column){ %>
                                <span class="drag-handle">::</span>
                            <% } %>
                            <%:=item.title%>
                            <% if(item.orderby){ %>
                                <span class="orderit">
                                    <i class="ordersell" dataval="<%:=item.orderby.asc%>">
                                        <svg width="10" height="16" viewBox="0 0 10 16" fill="none">
                                            <path d="M8 4 L8 16" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                                            <path d="M4 8 L8 4" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                                        </svg>
                                    </i><i class="ordersell" dataval="<%:=item.orderby.desc%>">
                                        <svg width="10" height="16" viewBox="0 0 10 16" fill="none">
                                            <path d="M2 4 L2 16" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                                            <path d="M2 16 L7 11" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                                        </svg>
                                    </i>
                                </span>
                            <% } %>
                            <% if(item.mark){ %>
                                <span class="tapmark" onclick="global_tap_mark('<%:=item.mark.model%>','<%:=item.mark.value%>','<%:=item.mark.style%>',this)">?</span>
                            <% } %>
                            </th>
                        <% } %>
                    <% } %>
                    <% if(config.model!='bind' && config.has_menu){ %>
                        <th data-column="__action">操作</th>
                    <% } %>
                </tr>
        </script>

        <!-- 版本二 -->
        <script type="text/html" id="template_body_line">
            <tr class="trline <%if(config.trclass){%>{{:=item.<%:=config.trclass%>}}<%}%>" dataid="{{:=item.id}}">
                <% if(config.batch){ %>
                    <td><input type="checkbox" class="trbatch"></td>
                <%}%>
                <% for(var k=0;k< list.length;k++){ %>
                    <% var item=list[k]; %>
                        <% if(!item.hidden){ %>
                            <td <% if(item.class){ %>class=<%:a=item.class%> <% } %> dataname="<%:=item.name %>" datatype="<%:=item.dataType%>" valtype="<%:=item.valueType%>" >
                                <%if(item.prefix){%>
                                    <%:=item.prefix%>
                                <%}%>
                                <% if(item.dataType=='image' ){ %>
                                    <div class="images">
                                        {{ if(item.<%:=item.name%> && item.<%:=item.name%> != null){ }}
                                        {{ item.<%:=item.name%>.split(',').forEach(img=>{ }}
                                            <img class="image" src="{{:=img}}">
                                        {{ }) }}
                                    {{ } }}
                                    </div>
                                <% }else if(item.dataType=='head' ){ %>
                                    <img class="head" src="{{:=item.<%:=item.name%>}}">
                                <% }else if(item.dataType=='switch' ){ %>
                                    <input type="checkbox" class="input-checkbox mui-switch mui-switch-anim" <% if(!item.switch_local){ %> onchange="handlerSwitchChange(this,'<%:=item.switch_confirm%>','<%:=item.switch_func%>')" <%}%> dataid="{{:=item.id}}" dataname="<%:=item.name%>" {{ if(item.<%:=item.name%>){ }}checked{{ } }} >
                                <% }else{ %>
                                    <% if(item.edit){ %>
                                            <% switch(item.dataType) { 
                                                case "Int32":case "Int64":case "fentoyuan":case "Double": %>
                                                    <input type="number" class="tedit style<%:=item.dataType%>" value="{{:=item.<%:=item.name%>}}" placeholder="<%:=item.placeholder || ''%>">
                                                <% break; 
                                                case "String": %>
                                                    <input type="text" class="tedit style<%:=item.dataType%>" value="{{:a=item.<%:=item.name%>}}">
                                                <% break; 
                                                case "select": %>
                                                    <select class="sedit">
                                                        {{ if(item.<%:=item.name%>_expend_select_values){ }}
                                                            {{ item.<%:=item.name%>_expend_select_values.forEach(_select=>{ }}
                                                                <option value="{{:=_select.value }}" {{ if(_select.value==item.<%:=item.name%>){ }}selected{{ } }}>{{:=_select.name}}</option>
                                                            {{ }) }}
                                                        {{ }else{ }}
                                                            <option>need <%:=item.name%>_expend_select_values</option>
                                                        {{ } }}
                                                    </select>
                                                <% break;
                                                case "outer": %>
                                                    <div class="outer">
                                                        <% if(item.dataFrom=='Int32' || item.dataFrom=='Int64'){ %>
                                                            <input type="number" class="outerid" autocomplete="to-off" style="display:none;" value="{{:=item.<%:=item.name%>}}" name="<%:=item.name%>">
                                                        <%}else{%>
                                                            <input type="text" class="outerid" autocomplete="to-off" style="display:none;"  value="{{:=item.<%:=item.name%>}}" name="<%:=item.name%>">
                                                        <%}%>
                                                        <input type="text" class="tedit outerdisplay" dataname="<%:=item.name%>" onclick="handler_edit_outer(this)" value="{{:=item.<%:=item.display%>}}" readonly placeholder="<%:=item.placeholder%>" >
                                                        <span class="Hui-iconfont Hui-iconfont-del spanclean" onclick="handlerEditClean(this)"></span>
                                                    </div>
                                                <% break; 
                                                case "Boolean": %>
                                                    <input type="checkbox" class="input-checkbox mui-switch mui-switch-anim" onchange="handlerSwitchChange(this)" dataid="{{:=item.id}}" dataname="<%:=item.name%>" {{ if(item.<%:=item.name%>){ }}checked{{ } }} >
                                                <% break; 
                                                default: %>
                                                    <span>未知：<%item.dataType%> {{:=item.<%:=item.name%>}}</span>
                                                <% break; 
                                            } %>
                                            <% if(item.minbtn){ %>
                                                <input type="button" class="minbtn <% if(item.minbtn.class){ %><%:=item.minbtn.class%><%}%>" value="<%:=item.minbtn.name%>" onclick="<%:=item.minbtn.func%>" dataid="{{:=item.id}}" dataname="<%:=item.name%>" >
                                            <% } %>
                                    <% }else{ %>
                                        <%if(item.html){%>
                                                <%:=item.html%>
                                        <%}else{%>
                                                <span class="itd">{{:=item.<%:=item.name%> ?? ''}}</span>
                                        <%}%>
                                    <% } %>
                                <% } %>
                                <%if(item.unit){%>
                                    <span class="unit"><%:=item.unit%></span>
                                <%}%>
                            </td>
                        <% } %>
                <% } %>
                <% if(config.model!='bind' && config.has_menu ){ %>
                    <td class="<%if(config.model!='select'){%>fleft<%}%> tapmenu">
                        {{ if(config.model=='view'){ }}
                            <% if(config.menubox){%>
                                <a href="javascript:;" onclick="open_menu_box(this);" onmouseover="open_menu_box(this);"><i class="Hui-iconfont Hui-iconfont-more"></i></a>
                                <div class="menubox" style="z-index: 100;" onmouseleave="$(this).css('visibility','hidden');">
                                        <% list.forEach(item=>{%>
                                            <% if(item.dataType=='menubox' ){ %>
                                                <% if(item.attributes){ %>
                                                    <% item.attributes.forEach(_attribute=>{ %>
                                                        <% if(_attribute.name=='menu' ){ %>
                                                            <a onclick="<%:=_attribute.args2%>" >
                                                                <%if(_attribute.args3){%>
                                                                    <i class="Hui-iconfont <%:=_attribute.args3%>"></i>
                                                                <%}%>
                                                                <%:=_attribute.args1%>
                                                            </a>
                                                        <% } %>
                                                    <% }) %>
                                                <% } %>
                                            <% } %>
                                            <% if(item.dataType=='tapbox' ){ %>
                                                <% if(item.attributes){ %>
                                                    <% item.attributes.forEach(_attribute=>{ %>
                                                        <% if(_attribute.name=='tap' ){ %>
                                                            <input type="button" onclick="<%:=_attribute.args2%>" <%if(_attribute.args3){%> class="<%:=_attribute.args3%>" <%}%> value="<%:=_attribute.args1%>" >
                                                        <% } %>
                                                    <% }) %>
                                                <% } %>
                                            <% } %>
                                            <% if(item.dataType=='ifmenubox' ){ %>
                                                {{ if(<%:=item.ifmenu.expression%>){ }}
                                                    <%:=item.ifmenu.value%>
                                                {{ } }}
                                            <% } %>
                                        <% }) %>
                                </div>
                            <% } %>

                            <% if(!config.disable_edit){ %>
                                {{ if(item.id){ }}
                                    <a href="javascript:;" onclick="tap_view_item(this)"
                                        dataid="{{:=item.id}}"><i
                                            class="Hui-iconfont Hui-iconfont-shuru"></i>编辑</a>
                                {{ } }}
                            <% } %>
                            <% list.forEach(item=>{%>
                                <% switch(item.dataType) { 
                                    case "menu": %>
                                        <% if(item.attributes){ %>
                                            <% item.attributes.forEach(_attribute=>{ %>
                                                <% if(_attribute.name=='menu' ){ %>
                                                    <a onclick="<%:a=item.menu.func%>" title="<%:a=item.menu.title%>" >
                                                        <% if(item.menu.icon){%>
                                                            <i class="Hui-iconfont <%:=item.menu.icon%>"></i>
                                                        <%}%>
                                                        <%:=item.menu.name%>
                                                    </a>
                                                <% } %>
                                            <% }) %>
                                        <% } %>
                                    <% break; 
                                    case "menuhtml": %>
                                        {{:n=item.<%:n=item.name%>}}
                                    <% break; 
                                    case "ifmenu": %>
                                        {{ if(<%:=item.ifmenu.expression%>){ }}
                                            <%:=item.ifmenu.value%>
                                        {{ } }}
                                    <% break; 
                                    case "tap": %>
                                        <% if(item.attributes){ %>
                                            <% item.attributes.forEach(_attribute=>{ %>
                                                <% if(_attribute.name=='tap' ){ %>
                                                    <input type="button" onclick="<%:=_attribute.args2%>" class="btn_tap <% if(_attribute.args3){%><%:=_attribute.args3%><%}%>" value="<%:=_attribute.args1%>" >
                                                <% } %>
                                            <% }) %>
                                        <% } %>
                                    <% break; 
                                    default: %>
                                        
                                    <% break; 
                                } %>
                            <% }) %>

                            <% if(config.enable_view){ %>
                                {{ if(item.id){ }}
                                    <a href="javascript:;" onclick="tap_detail_item(this)"
                                    dataid="{{:=item.id}}"><i
                                        class="Hui-iconfont Hui-iconfont-yanjing"></i>详细</a>
                                {{ } }}  
                            <% } %>

                            <% if(!config.disable_del){ %>
                                {{ if(item.id){ }}
                                    <a href="javascript:;" onclick="handler_tap_del(this)" class="a-del" dataid="{{:=item.id}}">
                                        <i class="Hui-iconfont Hui-iconfont-del3"></i>删除</a>
                                {{ } }}
                            <% } %>
                            
                        {{ } }}
                        
                        {{ if(config.model=='select'){ }}
                                <a href="javascript:;" class="mselect {{if(item.__selected){}}selected{{ } }}" onclick="tap_select_item(this)" dataid="{{:=item.id}}"><i class="Hui-iconfont Hui-iconfont-fabu"></i>选择</a>
                        {{ } }}

                    </td>
                <% } %>
            </tr>
        </script>
